<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form Staf Moscow</title>
<meta name="theme-color" content="#0C1F40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="moscow.css?v=29">
<style>
  #mIsi { padding:0 !important; }
  #mIsi > section[data-bagian="isi"] { padding:0 !important; margin:0 !important; }
  html.berbingkai, html.berbingkai body { overflow:hidden; }
  #bingkai { display:block; width:100%; border:0; background:var(--latar); }
  #muatan { padding:28px 20px; color:var(--abu); }
  #muatan.bad { color:var(--merah); }
  #muatan .ulang { margin-top:14px; }
  .sub-botol { display:flex; gap:8px; padding:12px 20px; background:#fff; border-bottom:1px solid var(--garis); }
  .sub-botol button { height:40px; padding:0 18px; border:1px solid var(--garis); border-radius:999px; background:#fff; font-weight:700; font-size:14px; color:var(--teks2); cursor:pointer; }
  .sub-botol button[aria-pressed="true"] { background:var(--navy); border-color:var(--navy); color:#fff; }
  section.pk-mode #bingkai, section.pk-mode #muatan { display:none !important; }
  #packing, #absen, #absenKelola { padding:18px 20px 60px; max-width:1100px; }
</style>
</head>
<body>
<main id="mIsi">
  <section data-bagian="isi">
    <div id="subBotol" class="sub-botol" role="group" aria-label="Bagian botol, stiker & packaging" hidden><button type="button" data-sub="botol" aria-pressed="true">Botol &amp; stiker</button><button type="button" data-sub="packing" aria-pressed="false">Packaging</button></div>
    <div id="packing" hidden></div>
    <div id="absen" hidden></div>
    <div id="absenKelola" hidden></div>
    <div id="muatan" role="status">Memuat form…</div>
    <iframe id="bingkai" title="Form staf" hidden></iframe>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script src="absen.js?v=3"></script>
<script src="absen-kelola.js?v=4"></script>
<script src="form-app.js?v=12"></script>
</body>
</html>
