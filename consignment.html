<style>
  #mIsi { padding:0 !important; }
  #mIsi > section[data-bagian="isi"] { padding:0 !important; margin:0 !important; }
  html.berbingkai, html.berbingkai body { overflow:hidden; }
  #wadah { position:relative; }
  #bingkai { display:block; width:100%; border:0; background:var(--latar); }
  #muatan { padding:28px 20px; color:var(--abu); }
  #muatan.bad { color:var(--merah); }
  #muatan .ulang { margin-top:14px; }
  #pilihToko { height:36px; border-radius:10px; border:1px solid var(--garis); background:#fff; color:var(--tinta); padding:0 10px; font-weight:600; max-width:220px; }
</style>

<body>
<main id="mIsi">
  <section data-bagian="isi">
    <div id="wadah">
      <div id="muatan" role="status">Memuat form toko…</div>
      <iframe id="bingkai" title="Form toko" hidden></iframe>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
