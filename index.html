<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moscow Supplies</title>
<meta name="theme-color" content="#172434">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moscow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="moscow.css">
<style>
  #pilih { display:grid; gap:8px; margin-top:4px; }
  #pilih a { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px; border:1px solid var(--garis);
    border-radius:12px; color:inherit; text-decoration:none; font-weight:700; }
  #pilih a span { font-weight:500; font-size:12.5px; color:var(--abu); }
  #pilih a:hover { background:var(--latar); }
  #pilih .grp { margin:10px 0 0; font-size:11.5px; font-weight:700; letter-spacing:.08em; color:var(--abu); text-transform:uppercase; }
  #pilih a b small { display:block; font-weight:500; font-size:12px; color:var(--abu); margin-top:1px; }
  .keluar { margin-top:16px; background:none; border:0; color:var(--abu); font:inherit; font-size:13px; cursor:pointer; padding:4px 0; }
</style>
</head>
<body>
<div id="mMasuk">
  <div class="kotak">
    <span class="lg" role="img" aria-label="Moscow Supplies"></span>
    <span class="ey">APLIKASI MOSCOW SUPPLIES</span>
    <h1 id="judul">Masuk</h1>
    <p id="teks">Masuk dengan akun Google yang sudah didaftarkan manajemen Moscow Supplies. Halaman bagianmu terbuka otomatis.</p>
    <button type="button" class="google" id="tMasuk" hidden></button>
    <div id="pilih" hidden></div>
    <div class="pesan" id="pesan" role="alert"></div>
    <button type="button" class="keluar" id="tKeluar" hidden>Keluar / ganti akun</button>
    <a class="priv" href="privasi.html">Kebijakan privasi</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var sb = window.supabase.createClient('https://ufhuvwfudblbyrwzugaa.supabase.co', 'sb_publishable_A8aEpcDck6ZOix9lrM727A_tI7QZ1xw',
    { auth: { persistSession: true, detectSessionInUrl: true, flowType: 'pkce' } });
  var GOOGLE = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>';
  function $(i) { return document.getElementById(i); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // Satu link untuk semua: halaman tujuan ditentukan dari peran akun (tabel pengguna), bukan dipilih sendiri.
  var TUJUAN = {
    gudang: [['Gudang Utama', 'form.html?f=gudang']],
    purchasing_shopeepay: [['Purchasing', 'form.html?f=purchasing'], ['Gudang Utama', 'form.html?f=gudang']],
    produksi: [['Staf Produksi', 'form.html?f=produksi']],
    bahan_baku: [['Staf Bahan Baku', 'form.html?f=bahanbaku']],
    kendali_bisnis: [['Kendali Bisnis', 'form.html?f=mike'], ['Persetujuan & laporan', 'form.html?f=mikelama'], ['Stok semua lokasi', 'stok.html']],
    toko: [['Form toko', 'consignment.html']],
    manajemen: [['Master Data', 'master.html'],
      ['#Consignment'], ['Consignment Sidoarjo', 'consignment.html?toko=Consignment%20Sidoarjo'], ['Consignment Medan', 'consignment.html?toko=Consignment%20Medan'],
      ['Consignment Renon', 'consignment.html?toko=Consignment%20Renon'],
      ['#Toko & staf'], ['Toko Offline', 'consignment.html?toko=Toko%20Offline', 'Laporan, stok, order'], ['Kasir Toko Offline', 'kasir.html', 'Nota penjualan'],
      ['Purchasing', 'form.html?f=purchasing'], ['Gudang Utama', 'form.html?f=gudang'],
      ['Reseller', 'master.html#jual', 'Order reseller di Master Data › Penjualan'],
      ['Staf Produksi', 'form.html?f=produksi'], ['Staf Bahan Baku', 'form.html?f=bahanbaku'],
      ['#Lainnya'], ['Payroll', 'form.html?f=payroll'], ['Form accounting', 'form.html?f=akunting'], ['Stok semua lokasi', 'stok.html'], ['Kendali Bisnis (Mike)', 'form.html?f=mike']]
  };
  function layarMasuk(pesan) {
    $('judul').textContent = 'Masuk'; $('pilih').hidden = true; $('tKeluar').hidden = true;
    $('tMasuk').hidden = false; $('pesan').textContent = pesan || '';
  }
  $('tMasuk').innerHTML = GOOGLE + 'Masuk dengan Google';
  $('tMasuk').onclick = function () {
    $('pesan').textContent = '';
    sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } } })
      .then(function (r) { if (r.error) $('pesan').textContent = 'Gagal membuka Google: ' + r.error.message; });
  };
  $('tKeluar').onclick = async function () { await sb.auth.signOut({ scope: 'local' }); layarMasuk(''); };
  async function periksa(sesi) {
    $('tMasuk').hidden = true; $('teks').textContent = 'Memeriksa akses ' + sesi.user.email + '…';
    var r = await sb.rpc('peran_saya');
    if (r.error) { layarMasuk('Tidak bisa memeriksa akses: ' + r.error.message); return; }
    var peran = r.data, l = null;
    try { l = (await sb.rpc('lingkup_saya')).data; } catch (e) { l = null; }
    var daftar = TUJUAN[peran];
    if (!daftar) {
      await sb.auth.signOut({ scope: 'local' });
      layarMasuk('Akun ' + sesi.user.email + ' belum didaftarkan. Minta manajemen Moscow Supplies menambahkan email ini.');
      return;
    }
    if (peran === 'toko' && /offline/i.test(l || '')) daftar = [['Form toko', 'consignment.html', 'Laporan, stok, order'], ['Kasir', 'kasir.html', 'Nota penjualan']];
    if (daftar.length === 1 || (peran === 'toko' && !/offline/i.test(l || ''))) { location.replace(daftar[0][1]); return; }
    $('judul').textContent = 'Pilih halaman';
    $('teks').textContent = 'Masuk sebagai ' + sesi.user.email + (l ? ' (' + l + ')' : '') + '.';
    $('pilih').innerHTML = daftar.map(function (d) {
      if (d[0].charAt(0) === '#') return '<div class="grp">' + esc(d[0].slice(1)) + '</div>';
      return '<a href="' + esc(d[1]) + '"><b>' + esc(d[0]) + (d[2] ? '<small>' + esc(d[2]) + '</small>' : '') + '</b><span>Buka ›</span></a>';
    }).join('');
    $('pilih').hidden = false; $('tKeluar').hidden = false;
  }
  sb.auth.getSession().then(function (r) {
    var s = r.data && r.data.session;
    if (s) periksa(s); else layarMasuk('');
  });
  sb.auth.onAuthStateChange(function (ev, s) { if (ev === 'SIGNED_IN' && s) periksa(s); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
})();
</script>
</body>
</html>
