<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script>/* Selalu lewat layar selamat datang saat aplikasi baru dibuka */try{if(!sessionStorage.getItem('mSambut'))location.replace('index.html');}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kendali Bisnis</title>
<meta name="theme-color" content="#0C1F40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kendali Bisnis">
<link rel="manifest" href="manifest-kendali.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="moscow.css?v=21">
<style>
  .bulan { display:flex; align-items:center; gap:10px; margin:0 0 6px; flex-wrap:wrap; }
  .bulan button { width:38px; height:38px; border-radius:12px; border:1px solid var(--garis); background:#fff; cursor:pointer; font-size:18px; font-weight:700; }
  .bulan button:disabled { opacity:.35; cursor:default; }
  .bulan h2 { margin:0; font-size:22px; font-weight:800; letter-spacing:-.01em; min-width:170px; }
  .tl { font-size:13px; color:var(--abu); margin:0 0 16px; }
  /* Tangga: penjualan -> HPP -> biaya -> laba */
  .anak { display:grid; grid-template-columns:130px 1fr; align-items:center; gap:12px; padding:5px 0; }
  .anak .nama { font-size:13px; font-weight:600; color:var(--abu); }
  .anak .jalur { position:relative; height:36px; }
  .anak .bar { position:absolute; top:0; bottom:0; border-radius:8px; }
  .anak .nilai { position:absolute; top:50%; transform:translateY(-50%); font-weight:700; font-size:14px; white-space:nowrap; }
  .anak.jual .bar { background:var(--biru); }
  .anak.kurang .bar { background:repeating-linear-gradient(135deg,#F6D5C9 0 6px,#FBEAE3 6px 12px); border:1px solid #EBB8A6; }
  .anak.laba .bar { background:var(--navy); }
  .anak.laba .nama { color:var(--tinta); font-weight:800; }
  .anak.laba .nilai { font-size:17px; }
  .anak .nilai.dalam { color:#fff; left:12px; }
  .margin-laba { font-size:13px; color:var(--abu); margin:4px 0 0 142px; }
  /* Rincian jalur / sektor */
  details.jl { border-top:1px solid var(--garis2); }
  details.jl summary { list-style:none; display:flex; flex-direction:column; gap:5px; padding:10px 0; cursor:pointer; }
  details.jl summary::-webkit-details-marker { display:none; }
  details.jl summary .tx { display:flex; justify-content:space-between; gap:8px; font-size:14px; }
  details.jl summary .tx span::before { content:"›"; display:inline-block; width:14px; color:var(--abu); transition:transform .15s; }
  details.jl[open] summary .tx span::before { transform:rotate(90deg); }
  details.jl.kosong summary { cursor:default; color:var(--abu); }
  details.jl.kosong summary .tx span::before { visibility:hidden; }
  details.jl .tr { height:8px; border-radius:99px; background:var(--garis2); }
  details.jl .is { height:8px; border-radius:99px; background:var(--biru); }
  details.jl.kel .is { background:var(--jingga); }
  .rinci { list-style:none; margin:0 0 10px 14px; padding:0; font-size:13.5px; }
  .rinci li { display:flex; justify-content:space-between; gap:12px; padding:4px 0; color:var(--teks2); }
  .rinci li span:last-child { white-space:nowrap; }
  /* HPP & harga */
  .daftar { list-style:none; margin:0; padding:0; }
  .daftar li { display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:11px 0; border-bottom:1px solid var(--garis2); }
  .daftar .nb { font-weight:700; font-size:14px; }
  .daftar .kd { font-size:12.5px; color:var(--abu); }
  .daftar .harga { text-align:right; font-size:13px; color:var(--abu); }
  .daftar .harga b { color:var(--tinta); font-size:14px; }
  .daftar .mg { text-align:right; font-size:13px; font-weight:700; }
  .mg.bagus { color:var(--hijau); } .mg.tipis { color:var(--kuning); } .mg.rugi { color:var(--merah); } .mg.tanpa { color:var(--abu); font-weight:500; }
  @media (max-width:520px) { .anak { grid-template-columns:92px 1fr; } .margin-laba { margin-left:104px; } }
</style>
</head>
<body>
<main id="mIsi">
  <section data-bagian="beranda" id="bBeranda"><div class="ksg">Memuat beranda…</div></section>
  <section data-bagian="laporan">
    <div class="bulan">
      <button id="tSebelum" type="button" aria-label="Bulan sebelumnya">‹</button>
      <h2 id="namaBulan">…</h2>
      <button id="tSesudah" type="button" aria-label="Bulan berikutnya">›</button>
      <span class="label" id="status"></span>
    </div>
    <p class="tl" id="dibuat"></p>
    <div id="isiLaporan"><div class="ksg">Memuat laporan…</div></div>
    <div class="msg tunggu">Halaman ini hanya untuk melihat. Pembayaran impor, ubah harga, dan setujui kenaikan harga masih lewat Kendali Bisnis yang lama.</div>
  </section>
  <section data-bagian="hpp">
    <div class="cd">
      <div class="baris">
        <label>Cari barang<input class="isian" id="cari" type="search" placeholder="Nama atau kode barang" autocomplete="off"></label>
        <label>Kategori<select class="isian" id="kategori"><option value="">Semua kategori</option></select></label>
      </div>
      <p class="sb" id="jumlahBarang" style="margin:0"></p>
      <ul class="daftar" id="daftarHpp"><li class="ksg">Memuat barang…</li></ul>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="moscow.js?v=9"></script>
<script src="beranda2.js?v=6"></script>
<script>
(function () {
  var M = Moscow, sb = M.sb, esc = M.esc;
  var NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  function $(id) { return document.getElementById(id); }
  function rp(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−Rp ' : 'Rp ') + Math.abs(n).toLocaleString('id-ID'); }
  function persen(a, b) { return b ? (a / b * 100).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%' : '–'; }
  function namaBulan(b) { var p = b.split('-'); return NAMA_BULAN[Number(p[1]) - 1] + ' ' + p[0]; }
  var laporan = [], posisi = 0, barang = null;

  M.mulai({
    aplikasi: 'KENDALI BISNIS', masukJudul: 'Kendali Bisnis', masukTeks: 'Ringkasan usaha, laporan bulanan, dan HPP Moscow Supplies. Masuk memakai akun Google yang sudah didaftarkan.',
    izin: function (ctx) { return ['manajemen', 'kendali_bisnis', 'accounting'].indexOf(ctx.peran) > -1 ? true : (ctx.peran ? 'Akun ' + ctx.email + ' tidak punya akses ke Kendali Bisnis.' : false); },
    menu: [{ k: 'beranda', nm: 'Beranda' }, { k: 'laporan', nm: 'Laporan', judul: 'Laporan bulanan' }, { k: 'hpp', nm: 'HPP & Harga', ik: 'harga' }],
    pindah: function (k) { document.documentElement.classList.toggle('m-bx', k === 'beranda'); if (k === 'hpp' && !barang) muatHpp(); },
    siap: function (ctx) {
      KB.email = String(ctx.email || '').toLowerCase(); KB.peran = ctx.peran === 'manajemen' ? 'Manajemen' : 'Kendali Bisnis'; var um = (ctx.sesi && ctx.sesi.user && ctx.sesi.user.user_metadata) || {}; KB.nama = um.full_name || um.name || '';
      M.aksi([{ nm: 'Muat ulang', ik: 'muat', klik: function () { muatSemua(); } }]);
      if (ctx.peran === 'manajemen') {
        // tautan kembali ke Master Data untuk manajemen
        var nav = document.querySelector('#mSide nav');
        if (nav) nav.insertAdjacentHTML('beforeend', '<div class="grp">APLIKASI LAIN</div><a class="it" href="master.html">' + M.svg('beranda') + '<span class="nm">Master Data</span></a>');
      } else if (ctx.peran === 'kendali_bisnis') {
        var nav2 = document.querySelector('#mSide nav');
        if (nav2) nav2.insertAdjacentHTML('beforeend', '<div class="grp">APLIKASI LAIN</div><a class="it" href="form.html?f=mike">' + M.svg('setuju') + '<span class="nm">Persetujuan &amp; pembayaran</span></a>' +
          '<a class="it" href="stok.html">' + M.svg('stok') + '<span class="nm">Stok semua lokasi</span></a>');
      }
      muatLaporan(); gambarBeranda();
    }
  });

  // ======================= BERANDA (tampilan sama dengan Beranda Master Data, hanya melihat) =======================
  var KB = { bulan: '', cache: {}, md: null, email: '', nama: '', namaTim: undefined };
  function muatSemua() { KB.cache = {}; KB.md = null; gambarBeranda(); muatLaporan(); barang = null; if (M.aktif() === 'hpp') muatHpp(); }
  function namaBln(b) { var p = String(b || '').split('-'); return (NAMA_BULAN[Number(p[1]) - 1] || '') + ' ' + p[0]; }
  function tindakanKB() {
    var md = KB.md || {}, d = md.beranda || {}, r = md.ringkasan || {}, L = [];
    if (d.nota && d.nota.n) L.push({ teks: d.nota.n + ' nota toko offline belum ada metode bayar', w: true });
    (d.akun || []).forEach(function (a) { if (a.v < 0) L.push({ teks: (/^saldo /i.test(a.n) ? a.n : 'Saldo ' + a.n) + ' minus ' + rp(-a.v), w: true }); });
    if (md.pantau && md.pantau.nTahan) L.push({ teks: md.pantau.nTahan + ' pengiriman tertahan', w: true });
    var t = ((md.setuju && md.setuju.menunggu) || 0) + ((md.request && md.request.n) || 0); if (t) L.push({ teks: t + ' persetujuan menunggu', w: true });
    if (r.pinjam && r.pinjam.lewat) L.push({ teks: r.pinjam.lewat + ' pinjaman barang lewat tanggal kembali', w: true });
    (r.akhir || []).forEach(function (a) { if (a.lalu !== null && a.lalu > (r.batas || 3)) L.push({ teks: a.n + ' belum lapor ' + a.lalu + ' hari', w: true }); });
    if (d.hari) {
      var tg = Number(String(d.hari).slice(8)), akhir = new Date(Number(d.hari.slice(0, 4)), Number(d.hari.slice(5, 7)), 0).getDate();
      if (tg >= akhir - 7) L.push({ teks: 'Hitung fisik akhir bulan · ' + akhir + ' ' + namaBln(d.bulan), w: false });
    }
    return L.map(function (x) { x.buka = ''; return x; });
  }
  async function gambarBeranda() {
    var el = $('bBeranda'); if (!el || !window.BerandaBaru) return;
    var k = KB.bulan || '';
    if (!KB.cache[k]) {
      if (el.querySelector('.bx-grid')) el.style.opacity = '.55';
      var rr = await Promise.all([sb.rpc('beranda_data', { p_bulan: k }), sb.rpc('beranda_kpi', { p_bulan: k }), KB.md ? null : sb.rpc('beranda_md'),
        KB.namaTim === undefined ? sb.from('pengguna').select('nama').eq('email', KB.email).maybeSingle() : null]);
      el.style.opacity = '';
      if (rr[0].error) { el.innerHTML = '<div class="msg bad">Beranda gagal dimuat: ' + esc(rr[0].error.message) + '</div>'; return; }
      if (rr[2]) KB.md = rr[2].error ? {} : rr[2].data || {};
      if (rr[3]) KB.namaTim = (rr[3].data && rr[3].data.nama) || '';
      KB.cache[k] = { B: rr[0].data, K: rr[1].error ? null : rr[1].data };
    }
    var C = KB.cache[k];
    BerandaBaru.gambar(el, C.B, (KB.md || {}).beranda || {}, tindakanKB(), {
      gantiBulan: function (m) { KB.bulan = m; gambarBeranda(); },
      buka: function (b) { if (b === 'laporan' || b === 'hpp') M.buka(b); else { var t = $(b === 'purch' ? 'bxPo' : 'bxRinci'); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } },
      kpi: C.K, pengguna: { nama: KB.namaTim || KB.nama, email: KB.email }, peran: KB.peran,
      menuAkun: [{ nm: 'Muat ulang data', klik: muatSemua }, { nm: 'Laporan bulanan', k: 'laporan' }, { nm: 'HPP & Harga', k: 'hpp' },
        { nm: 'Keluar / ganti akun', klik: function () { sb.auth.signOut({ scope: 'local' }).then(function () { location.href = 'index.html'; }); } }]
    });
  }

  async function muatLaporan() {
    var r = await sb.from('hasil_hitung').select('kunci,data').like('kunci', 'laporan:%').order('kunci');
    if (r.error) { $('isiLaporan').innerHTML = '<div class="msg bad">Laporan gagal dimuat: ' + esc(r.error.message) + '</div>'; return; }
    laporan = (r.data || []).map(function (x) { return x.data; }).filter(function (d) { return d && d.bulan; });
    if (!laporan.length) { $('isiLaporan').innerHTML = '<div class="msg w">Belum ada laporan. Laporan dibuat otomatis setiap sinkron.</div>'; return; }
    posisi = laporan.length - 1;
    while (posisi > 0 && !laporan[posisi].omzet && !laporan[posisi].keluar) posisi--;
    gambarLaporan();
  }
  $('tSebelum').onclick = function () { if (posisi > 0) { posisi--; gambarLaporan(); } };
  $('tSesudah').onclick = function () { if (posisi < laporan.length - 1) { posisi++; gambarLaporan(); } };

  function anak(kelas, nama, kiri, lebar, nilai, maks) {
    var l = maks ? kiri / maks * 100 : 0, w = maks ? Math.max(lebar / maks * 100, .6) : 0;
    var dalam = w > 34 && kelas !== 'kurang';
    var pos = dalam ? '' : (l + w > 62 ? 'right:calc(' + (100 - l) + '% + 8px)' : 'left:calc(' + (l + w) + '% + 8px)');
    return '<div class="anak ' + kelas + '"><span class="nama">' + nama + '</span><div class="jalur"><div class="bar" style="left:' + l + '%;width:' + w + '%"></div>' +
      '<span class="nilai angka' + (dalam ? ' dalam' : '') + '" style="' + pos + '">' + (kelas === 'kurang' ? '−' : '') + rp(nilai).replace('−', '') + '</span></div></div>';
  }
  function jalur(item, total, kel) {
    var bar = '<div class="tr"><div class="is" style="width:' + (total ? Math.max(1, item.v / total * 100) : 0) + '%"></div></div>';
    var sum = '<summary><div class="tx"><span>' + esc(item.n) + '</span><b class="angka">' + rp(item.v) + '</b></div>' + (item.v ? bar : '') + '</summary>';
    if (!item.det || !item.det.length) return '<details class="jl kosong' + (kel ? ' kel' : '') + '">' + sum + '</details>';
    return '<details class="jl' + (kel ? ' kel' : '') + '">' + sum + '<ul class="rinci">' + item.det.map(function (d) { return '<li><span>' + esc(d.n) + '</span><span class="angka">' + rp(d.v) + '</span></li>'; }).join('') + '</ul></details>';
  }

  function gambarLaporan() {
    var d = laporan[posisi];
    $('namaBulan').textContent = namaBulan(d.bulan);
    $('tSebelum').disabled = posisi === 0; $('tSesudah').disabled = posisi === laporan.length - 1;
    $('status').textContent = d.final ? 'Final' : 'Sementara'; $('status').className = 'label ' + (d.final ? 'ok' : 'w');
    $('dibuat').textContent = 'Dihitung ' + (d.dibuat || '–') + (d.final ? '' : '. Angka berubah sampai bulan ditutup.');
    if (!d.omzet && !d.keluar) { $('isiLaporan').innerHTML = '<div class="cd"><div class="ksg">Belum ada transaksi tercatat untuk ' + esc(namaBulan(d.bulan)) + '.</div></div>'; return; }
    var h = '<div class="kp">' +
      '<div class="kt"><span class="l">Penjualan</span><span class="v angka">' + M.jt(d.omzet) + '</span><span class="k">' + rp(d.omzet) + '</span></div>' +
      '<div class="kt"><span class="l">HPP</span><span class="v angka">' + M.jt(d.hpp) + '</span><span class="k' + (d.hppInfo ? ' w' : '') + '">' + (d.hppInfo ? esc(d.hppInfo) : rp(d.hpp)) + '</span></div>' +
      '<div class="kt"><span class="l">Laba usaha</span><span class="v angka' + (d.laba < 0 ? ' mn' : '') + '">' + M.jt(d.laba) + '</span><span class="k">' + persen(d.laba, d.omzet) + ' dari penjualan</span></div>' +
      '<div class="kt"><span class="l">Hasil kas bersih</span><span class="v angka' + (d.kas < 0 ? ' mn' : '') + '">' + M.jt(d.kas) + '</span><span class="k">Masuk ' + M.jt(d.omzet) + ' − keluar ' + M.jt(d.keluar) + '</span></div></div>';
    var maks = Math.max(d.omzet, d.hpp + d.biaya, 1);
    h += '<div class="cd"><div class="kpl"><h3>Dari penjualan ke laba</h3><span class="sb">' + esc(namaBulan(d.bulan)) + '</span></div><div>' +
      anak('jual', 'Penjualan', 0, d.omzet, d.omzet, maks) +
      anak('kurang', 'HPP', d.omzet - d.hpp, d.hpp, d.hpp, maks) +
      anak('kurang', 'Biaya operasional', d.omzet - d.hpp - d.biaya, d.biaya, d.biaya, maks) +
      anak('laba', 'Laba usaha', 0, Math.max(d.laba, 0), d.laba, maks) +
      '<p class="margin-laba">Laba ' + persen(d.laba, d.omzet) + ' dari penjualan</p></div></div>';
    h += '<div class="dua"><div class="cd"><div class="kpl"><h3>Uang masuk per jalur</h3><span class="sb angka">' + rp(d.omzet) + '</span></div><div>' +
      (d.masuk || []).map(function (m) { return jalur(m, d.omzet, false); }).join('') + '</div></div>';
    h += '<div class="cd"><div class="kpl"><h3>Uang keluar per sektor</h3><span class="sb angka">' + rp(d.keluar) + '</span></div><div>' +
      ((d.sektor || []).length ? d.sektor.map(function (m) { return jalur(m, d.keluar, true); }).join('') : '<div class="ksg">Belum ada uang keluar.</div>') + '</div></div></div>';
    if ((d.luar || []).length) h += '<div class="cd" style="margin-top:16px"><h3>Di luar laba rugi</h3><table class="tabel"><tbody>' + d.luar.map(function (x) {
      return '<tr><td>' + esc(x.n) + '<small>' + (x.arah === 'Masuk' ? 'Uang masuk' : 'Uang keluar') + '</small></td><td class="r angka">' + rp(x.v) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    if ((d.peringatan || []).length) h += '<div class="cd"><h3>Perlu dicek</h3>' + d.peringatan.map(function (x) { return '<div class="msg w" style="margin:0">' + esc(typeof x === 'string' ? x : (x.n || JSON.stringify(x))) + '</div>'; }).join('') + '</div>';
    $('isiLaporan').innerHTML = h;
  }

  async function muatHpp() {
    $('daftarHpp').innerHTML = '<li class="ksg">Memuat barang…</li>';
    var hasil = await Promise.all([
      sb.from('hasil_hitung').select('data').eq('kunci', 'hpp').maybeSingle(),
      sb.from('barang_order').select('kode,nama_barang,harga_jual,kategori').order('nama_barang')
    ]);
    var err = hasil[0].error || hasil[1].error;
    if (err) { $('daftarHpp').innerHTML = '<li class="msg bad">Data gagal dimuat: ' + esc(err.message) + '</li>'; return; }
    var peta = (hasil[0].data && hasil[0].data.data && hasil[0].data.data.hpp) || {}, lihat = {};
    barang = [];
    (hasil[1].data || []).forEach(function (b) {
      var kode = String(b.kode || '').trim(); if (!kode || lihat[kode]) return; lihat[kode] = 1;
      var hj = Number(b.harga_jual) || 0, hpp = Number(peta[kode]) || 0;
      barang.push({ kode: kode, nama: b.nama_barang || kode, kat: (b.kategori || '').trim(), hj: hj, hpp: hpp, m: hj && hpp ? (hj - hpp) / hj : null });
    });
    var kats = barang.map(function (b) { return b.kat; }).filter(function (k, i, a) { return k && a.indexOf(k) === i; }).sort();
    $('kategori').innerHTML = '<option value="">Semua kategori</option>' + kats.map(function (k) { return '<option>' + esc(k) + '</option>'; }).join('');
    var info = hasil[0].data && hasil[0].data.data && hasil[0].data.data.dibuat;
    $('jumlahBarang').dataset.waktu = info ? 'HPP dihitung ' + info + '. ' : '';
    gambarHpp();
  }
  function gambarHpp() {
    var q = $('cari').value.trim().toLowerCase(), k = $('kategori').value;
    var tampil = barang.filter(function (b) { return (!k || b.kat === k) && (!q || b.nama.toLowerCase().indexOf(q) > -1 || b.kode.toLowerCase().indexOf(q) > -1); });
    var tanpa = tampil.filter(function (b) { return !b.hpp; }).length;
    $('jumlahBarang').textContent = ($('jumlahBarang').dataset.waktu || '') + tampil.length + ' barang' + (tanpa ? ', ' + tanpa + ' belum punya HPP' : '') + '.';
    if (!tampil.length) { $('daftarHpp').innerHTML = '<li class="ksg">Tidak ada barang yang cocok. Ubah kata cari atau kategori.</li>'; return; }
    $('daftarHpp').innerHTML = tampil.map(function (b) {
      var kelas = b.m == null ? 'tanpa' : b.m < 0 ? 'rugi' : b.m < .25 ? 'tipis' : 'bagus';
      var teksM = b.m == null ? (b.hpp ? 'Harga jual kosong' : 'HPP belum ada') : 'Margin ' + rp(b.hj - b.hpp) + ' (' + persen(b.hj - b.hpp, b.hj) + ')';
      return '<li><span class="nb">' + esc(b.nama) + '</span><span class="harga angka">Jual <b>' + (b.hj ? rp(b.hj) : '–') + '</b></span>' +
        '<span class="kd">' + esc(b.kode) + (b.kat ? ' · ' + esc(b.kat) : '') + '</span><span class="harga angka">HPP ' + (b.hpp ? rp(b.hpp) : '–') + '</span>' +
        '<span></span><span class="mg angka ' + kelas + '">' + teksM + '</span></li>';
    }).join('');
  }
  $('cari').oninput = function () { if (barang) gambarHpp(); };
  $('kategori').onchange = function () { if (barang) gambarHpp(); };
})();
</script>
