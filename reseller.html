<!-- 5 Nov 2026: form order reseller sekarang order.html (tanpa Apps Script). Halaman ini tetap ada untuk aplikasi
     "Moscow Order" yang sudah terpasang di HP reseller: kode dari link lama dibawa ke order.html, lalu dibuka. -->
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:40px 16px;color:#5A6677">
Membuka form order…
<script>
(function () {
  var tujuan = 'order.html', k = '';
  try {
    var lama = localStorage.getItem('reseller_link') || '';
    var m = /[?&]key=([A-Za-z0-9]{8})(?:&|$)/.exec(lama);
    if (m && !localStorage.getItem('order_kunci')) k = m[1];
    localStorage.removeItem('reseller_link');
  } catch (e) { }
  location.replace(tujuan + (k ? '?k=' + encodeURIComponent(k) : ''));
})();
</script>
</body>
