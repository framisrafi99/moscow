<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stok Moscow</title>
<meta name="theme-color" content="#172434">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stok">
<link rel="manifest" href="manifest-stok.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="moscow.css?v=8">
<style>
  .tl { font-size:13px; color:var(--abu); margin:0 0 14px; }
  .kat { font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--abu); padding:14px 0 6px; border-bottom:1px solid var(--garis); text-transform:none; }
  .daftar { list-style:none; margin:0; padding:0; }
  .daftar li { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--garis2); }
  .daftar .isi { flex:1; min-width:0; }
  .daftar .nb { font-weight:700; font-size:14px; }
  .daftar .kd { font-size:12.5px; color:var(--abu); }
  .daftar .sebar { font-size:12.5px; color:var(--abu); margin-top:2px; }
  .daftar .q { font-size:18px; font-weight:800; min-width:60px; text-align:right; white-space:nowrap; }
  .daftar .q small { font-size:12px; font-weight:500; color:var(--abu); margin-left:2px; }
  .daftar li.minus .q { color:var(--merah); }
  .daftar li.minus .nb::after { content:"Stok minus, perlu dicek"; display:block; font-size:12px; font-weight:600; color:var(--merah); }
</style>
</head>
<body>
<main id="mIsi">
  <section data-bagian="stok">
    <div class="chip" id="rak" role="group" aria-label="Pilih lokasi"></div>
    <div id="isi"><div class="ksg">Memuat stok…</div></div>
    <div class="msg tunggu">Halaman ini hanya untuk melihat. Stok berubah lewat form masing-masing seperti biasa, lalu ikut diperbarui di sini paling lambat 30 menit kemudian.</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="moscow.js?v=7"></script>
<script>
(function () {
  var M = Moscow, sb = M.sb, esc = M.esc;
  var LENGKAP = ['manajemen', 'kendali_bisnis', 'accounting'];
  var BOLEH = LENGKAP.concat(['gudang', 'purchasing_shopeepay', 'produksi', 'toko']);
  function $(id) { return document.getElementById(id); }
  function rp(n) { return 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID'); }
  function jml(n) { return (Number(n) || 0).toLocaleString('id-ID'); }
  var data = null, pilih = 'semua', cari = '', kat = '';

  M.mulai({
    aplikasi: 'STOK BARANG', masukJudul: 'Stok barang', masukTeks: 'Sisa stok tiap gudang, toko, dan consignment Moscow Supplies. Masuk memakai akun Google yang sudah didaftarkan.',
    izin: function (ctx) { return BOLEH.indexOf(ctx.peran) > -1 ? true : (ctx.peran ? 'Akun ' + ctx.email + ' tidak punya akses ke halaman stok.' : false); },
    menu: [{ k: 'stok', nm: 'Stok per lokasi', ik: 'stok', judul: 'Stok barang' }],
    siap: function (ctx) {
      M.aksi([{ nm: 'Muat ulang', ik: 'muat', klik: function () { muat(LENGKAP.indexOf(ctx.peran) > -1); } }]);
      if (ctx.peran === 'manajemen') {
        var nav = document.querySelector('#mSide nav');
        if (nav) nav.insertAdjacentHTML('beforeend', '<div class="grp">APLIKASI LAIN</div><a class="it" href="master.html">' + M.svg('beranda') + '<span class="nm">Master Data</span></a>');
      }
      muat(LENGKAP.indexOf(ctx.peran) > -1);
    }
  });

  async function muat(lengkap) {
    var r = lengkap ? await sb.from('hasil_hitung').select('kunci,data').eq('kunci', 'stok:semua')
      : await sb.from('hasil_hitung').select('kunci,data').like('kunci', 'stok:lokasi:%');
    if (r.error) { $('isi').innerHTML = '<div class="msg bad">Stok gagal dimuat: ' + esc(r.error.message) + '</div>'; return; }
    var baris = r.data || [];
    if (!baris.length) { $('isi').innerHTML = '<div class="msg w">Stok belum tersedia untuk akun ini. Data dikirim otomatis saat sinkron berikutnya.</div>'; return; }
    if (lengkap) {
      var d = baris[0].data;
      data = { lokasi: d.lokasi, barang: d.barang, lengkap: true, diperbarui: d.diperbarui, gagal: d.gagal || [] };
    } else {
      var lokasi = [], idx = {};
      baris.sort(function (a, b) { return a.kunci < b.kunci ? -1 : 1; }).forEach(function (x, i) {
        var id = 'L' + i; lokasi.push({ id: id, n: x.data.n, ket: x.data.ket });
        (x.data.barang || []).forEach(function (b) { if (!idx[b.k]) idx[b.k] = { k: b.k, n: b.n, kat: b.kat, q: {}, tot: 0 }; idx[b.k].q[id] = b.q; idx[b.k].tot += b.q; });
      });
      data = { lokasi: lokasi, barang: Object.keys(idx).map(function (k) { return idx[k]; }), lengkap: false, diperbarui: baris[0].data.diperbarui, gagal: [] };
      data.barang.sort(function (a, b) { return (a.kat || '').localeCompare(b.kat || '') || a.n.localeCompare(b.n); });
    }
    if (data.lokasi.length === 1) pilih = data.lokasi[0].id;
    gambarRak(); gambar();
  }
  function stokDi(b) { return pilih === 'semua' ? b.tot : (b.q[pilih] || 0); }

  function gambarRak() {
    var tombol = [];
    if (data.lokasi.length > 1) { var t = 0; data.barang.forEach(function (b) { t += b.tot; }); tombol.push({ id: 'semua', n: 'Semua lokasi', q: t }); }
    data.lokasi.forEach(function (l) { var q = 0; data.barang.forEach(function (b) { q += b.q[l.id] || 0; }); tombol.push({ id: l.id, n: l.n, q: q }); });
    $('rak').hidden = tombol.length < 2;
    $('rak').innerHTML = tombol.map(function (x) { return '<button type="button" data-id="' + x.id + '" aria-pressed="' + (x.id === pilih) + '"><span>' + esc(x.n) + '</span><b class="angka">' + jml(x.q) + ' pcs</b></button>'; }).join('');
    $('rak').querySelectorAll('button').forEach(function (b) { b.onclick = function () { pilih = b.dataset.id; kat = ''; gambarRak(); gambar(); }; });
  }

  function gambar() {
    var lok = data.lokasi.filter(function (l) { return l.id === pilih; })[0];
    M.judul(lok ? lok.n : 'Stok semua lokasi');
    var adaDiSini = data.barang.filter(function (b) { return stokDi(b) !== 0; });
    var kats = adaDiSini.map(function (b) { return b.kat || 'Lainnya'; }).filter(function (k, i, a) { return a.indexOf(k) === i; });
    if (kat && kats.indexOf(kat) === -1) kat = '';
    var q = cari.toLowerCase();
    var tampil = adaDiSini.filter(function (b) { return (!kat || (b.kat || 'Lainnya') === kat) && (!q || b.n.toLowerCase().indexOf(q) > -1 || b.k.toLowerCase().indexOf(q) > -1); });
    var h = '<p class="tl">' + (lok && lok.ket ? esc(lok.ket) + ' · ' : '') + 'Diperbarui ' + esc(data.diperbarui || '–') + '</p>';
    if (data.gagal && data.gagal.length) h += '<div class="msg w">Sebagian lokasi gagal dihitung: ' + esc(data.gagal.join('; ')) + '</div>';
    var pcs = 0, minus = 0; adaDiSini.forEach(function (b) { var s = stokDi(b); pcs += s; if (s < 0) minus++; });
    if (data.lengkap) {
      var nh = 0, nj = 0, tanpa = 0;
      adaDiSini.forEach(function (b) { var s = stokDi(b); if (s > 0) { nh += s * (b.hpp || 0); nj += s * (b.hj || 0); if (!b.hpp) tanpa++; } });
      h += '<div class="kp"><div class="kt"><span class="l">Jumlah barang</span><span class="v angka">' + jml(pcs) + ' pcs</span><span class="k">' + adaDiSini.length + ' jenis barang</span></div>' +
        '<div class="kt"><span class="l">Nilai HPP</span><span class="v angka">' + M.jt(nh) + '</span><span class="k' + (tanpa ? ' w' : '') + '">' + (tanpa ? tanpa + ' barang tanpa HPP' : rp(nh)) + '</span></div>' +
        '<div class="kt"><span class="l">Nilai jual</span><span class="v angka">' + M.jt(nj) + '</span><span class="k">' + rp(nj) + '</span></div>' +
        '<div class="kt"><span class="l">Stok minus</span><span class="v angka' + (minus ? ' mn' : '') + '">' + minus + '</span><span class="k' + (minus ? ' w' : '') + '">' + (minus ? 'Perlu dicek' : 'Tidak ada') + '</span></div></div>';
    }
    h += '<div class="cd"><div class="baris"><label>Cari barang<input class="isian" id="cari" type="search" placeholder="Nama atau kode barang" autocomplete="off" value="' + esc(cari) + '"></label>' +
      '<label>Kategori<select class="isian" id="kat"><option value="">Semua kategori</option>' + kats.map(function (k) { return '<option' + (k === kat ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('') + '</select></label></div>';
    var mTampil = tampil.filter(function (b) { return stokDi(b) < 0; }).length;
    h += '<p class="sb" style="margin:0">' + tampil.length + ' barang' + (mTampil ? ', ' + mTampil + ' stok minus' : '') + '.</p>';
    if (!tampil.length) h += '<div class="ksg">' + (adaDiSini.length ? 'Tidak ada barang yang cocok. Ubah kata cari atau kategori.' : 'Belum ada stok tercatat di lokasi ini.') + '</div>';
    else {
      var namaLok = {}; data.lokasi.forEach(function (l) { namaLok[l.id] = l.n; });
      var katSkrg = null, isi = '';
      tampil.forEach(function (b) {
        var s = stokDi(b), k = b.kat || 'Lainnya';
        if (k !== katSkrg) { isi += (katSkrg === null ? '' : '</ul>') + '<div class="kat">' + esc(k) + '</div><ul class="daftar">'; katSkrg = k; }
        var sebar = pilih === 'semua' ? Object.keys(b.q).filter(function (id) { return b.q[id]; }).map(function (id) { return esc(namaLok[id] || id) + ' ' + jml(b.q[id]); }).join(' · ') : '';
        isi += '<li class="' + (s < 0 ? 'minus' : '') + '"><div class="isi"><div class="nb">' + esc(b.n) + '</div><div class="kd">' + esc(b.k) + '</div>' + (sebar ? '<div class="sebar">' + sebar + '</div>' : '') + '</div><div class="q angka">' + jml(s) + '<small>pcs</small></div></li>';
      });
      h += '<div>' + isi + '</ul></div>';
    }
    h += '</div>';
    $('isi').innerHTML = h;
    var ci = $('cari');
    ci.oninput = function () { cari = ci.value; var pos = ci.selectionStart; gambar(); var n = $('cari'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } };
    $('kat').onchange = function () { kat = this.value; gambar(); };
  }
})();
</script>
</body>
</html>
